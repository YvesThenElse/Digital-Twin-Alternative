<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --surface:#FAF8F5; --surface-2:#FFFFFF; --surface-3:#F2EEE8;
    --line:#E5E0D8; --line-strong:#D2CABE;
    --ink:#1A1815; --ink-2:#57524B; --ink-3:#8A8279;
    --shadow:0 1px 2px rgba(26,24,21,.06), 0 8px 24px -12px rgba(26,24,21,.18);
    --era-1:#A6572F; --era-2:#B0842B; --era-3:#6E7F4A;
    --era-4:#3F7A80; --era-5:#4A6BA8; --era-6:#6B5EA8;
    --era-ink:#7E5D14; --focus:#3F7A80; --r-s:4px; --r-m:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface:#16140F; --surface-2:#1E1B16; --surface-3:#24201A;
      --line:#2E2A26; --line-strong:#3D3832;
      --ink:#F2EFE9; --ink-2:#A8A199; --ink-3:#6E6862;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
      --era-1:#C9713F; --era-2:#D8A63C; --era-3:#8CA061;
      --era-4:#57A0A8; --era-5:#6D8FD0; --era-6:#8F81D0;
      --era-ink:#D8AC50; --focus:#7FB3B8;
    }
  }
  :root[data-theme="dark"]{
    --surface:#16140F; --surface-2:#1E1B16; --surface-3:#24201A;
    --line:#2E2A26; --line-strong:#3D3832;
    --ink:#F2EFE9; --ink-2:#A8A199; --ink-3:#6E6862;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --era-1:#C9713F; --era-2:#D8A63C; --era-3:#8CA061;
    --era-4:#57A0A8; --era-5:#6D8FD0; --era-6:#8F81D0;
    --era-ink:#D8AC50; --focus:#7FB3B8;
  }

  *{box-sizing:border-box}
  body{background:var(--surface);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

  .shell{max-width:1060px;margin:0 auto;padding:18px 14px 40px;display:flex;flex-direction:column;gap:12px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
  .bar__id{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .bar__id span{color:var(--ink-3);font-weight:400}
  .seg{margin-left:auto;display:flex;gap:2px;padding:2px;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-m)}
  .seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .note{color:var(--ink-3);font-size:12.5px;max-width:74ch}
  .note b{color:var(--ink-2);font-weight:600}

  .app{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}

  /* en-tête */
  .hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .ic{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--ink-2);flex:none}
  .ic:hover{background:var(--surface-3)}
  .hd__t{flex:1;min-width:0}
  .hd__t h1{font-family:"Fraunces",Georgia,serif;font-size:clamp(21px,3vw,27px);font-weight:600;letter-spacing:-.018em;margin:0;line-height:1.18;text-wrap:balance}
  .hd__t p{margin:3px 0 0;font-size:13px;color:var(--ink-3);display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .chip{border:1px solid var(--line-strong);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}

  .cols{display:flex;flex-direction:column}
  @media (min-width:900px){
    .cols{flex-direction:row;align-items:flex-start}
    .colL{width:298px;flex:none;position:sticky;top:0;border-right:1px solid var(--line)}
    .colR{flex:1;min-width:0}
  }

  /* ── couche personnelle : elle passe avant les faits ── */
  .me{padding:20px;display:flex;flex-direction:column;gap:15px}
  .me__top{display:flex;gap:15px}
  .art{position:relative;overflow:hidden;border-radius:var(--r-s);display:grid;place-items:center;flex:none;background-color:var(--era-2)}
  .art::before{content:"";position:absolute;inset:0;background:var(--art-pattern);opacity:.22}
  .art>span{position:relative;z-index:1;font-family:"Fraunces",Georgia,serif;font-weight:800;color:#FFF8EA;text-align:center;line-height:1.03;letter-spacing:-.015em;padding:0 8%;text-shadow:0 1px 3px rgba(0,0,0,.3);overflow-wrap:break-word;hyphens:auto}
  .me__art{width:104px;aspect-ratio:3/4;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .me__art>span{font-size:12.5px}
  .me__sum{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .me__marks{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .me__line{font-family:"Fraunces",Georgia,serif;font-size:17px;line-height:1.32;letter-spacing:-.01em;margin:0}
  .me__line b{font-weight:600}
  .me__sub{font-size:12.5px;color:var(--ink-3)}

  .souv{
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:16px;line-height:1.45;
    margin:0;padding-left:13px;border-left:2px solid var(--c);color:var(--ink);
  }

  /* déclarer se fait ici aussi, pas seulement en saisie massive */
  .q{display:flex;flex-direction:column;gap:6px}
  .q__l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .q__r{display:flex;gap:6px;flex-wrap:wrap}
  .q__r button{
    min-height:38px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);
    font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:all .12s;
  }
  .q__r button:hover{border-color:var(--ink-3)}
  .q__r button[aria-pressed="true"]{
    background:color-mix(in srgb,var(--era-2) 15%,transparent);
    border-color:color-mix(in srgb,var(--era-2) 58%,transparent);color:var(--era-ink);font-weight:600;
  }

  /* Icônes dessinées plutôt que pastilles géométriques : une forme abstraite
     oblige à apprendre une légende. Trois familles se distinguent par leur
     sujet — gestes de jeu, objets et lieux, affect — et non par leur géométrie. */
  .mk{flex:none;color:var(--era-ink);vertical-align:-3px}
  .q__r button[aria-pressed="true"] .mk{color:currentColor}
  .me__marks .mk{color:var(--era-ink)}

  /* ── identification : désambiguïser, jamais décrire ── */
  .ident{padding:15px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .aka{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .aka b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:2px}
  .aka span{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
  .fact{margin:0;font-size:13.5px;color:var(--ink-2);max-width:64ch;line-height:1.5}

  /* ── ouverture vers l'extérieur ── */
  .ph{
    font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    border:1px solid var(--line-strong);border-radius:999px;padding:2px 7px;color:var(--ink-3);
    margin-left:auto;flex:none;align-self:center;
  }
  .ext{display:flex;flex-direction:column;gap:7px}
  .ext__r{
    display:flex;align-items:center;gap:11px;padding:10px 12px;
    border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);
  }
  .ext__r b{font-size:13.5px;font-weight:500;flex:none}
  .ext__r code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
    color:var(--ink-3);background:var(--surface-3);padding:1px 7px;border-radius:3px;
  }
  .ext__r svg{margin-left:auto;color:var(--ink-3);flex:none}

  /* ── ce que d'autres en ont fait ── */
  .oth{display:flex;flex-wrap:wrap;gap:18px 30px;margin-bottom:14px}
  .oth div{display:flex;flex-direction:column}
  .oth b{font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .oth span{font-size:11.5px;color:var(--ink-3)}
  .pub{display:flex;flex-direction:column;gap:10px}
  .pub p{
    margin:0;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:15px;line-height:1.45;
    padding-left:13px;border-left:2px solid var(--line-strong);color:var(--ink);
  }
  .pub p em{
    display:block;font-family:"IBM Plex Sans",sans-serif;font-style:normal;
    font-size:11.5px;color:var(--ink-3);margin-top:4px;
  }

  /* ── sections ── */
  .sec{padding:20px;border-top:1px solid var(--line)}
  .sec__h{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
  .sec__h h2{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .sec__h span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .sec__h .more{margin-left:auto;font-size:12.5px;color:var(--focus);text-decoration:underline;text-underline-offset:3px}
  .sec p.intro{margin:-6px 0 13px;font-size:12.5px;color:var(--ink-3);max-width:60ch}

  /* ── la vie de l'œuvre, et la vôtre avec elle ── */
  /* Les sorties se groupent par années voisines : quatre rééditions en deux ans
     empilaient leurs étiquettes au même endroit. Le regroupement rend l'axe
     lisible, et le détail vit dans « Éditions connues » juste en dessous. */
  .life{padding:4px 0 2px}
  .life__ax{position:relative;margin:0 26px}
  .life__rule{position:absolute;left:0;right:0;top:64px;height:2px;background:var(--line-strong);border-radius:1px}
  .grp{position:absolute;top:64px;transform:translate(-50%,-50%);z-index:2}
  .grp i{
    display:grid;place-items:center;width:12px;height:12px;border-radius:50%;
    background:var(--c);box-shadow:0 0 0 3px var(--surface-2);
  }
  .grp.multi i{width:17px;height:17px}
  .grp.multi i b{font-family:"IBM Plex Sans",sans-serif;font-size:9px;font-weight:600;color:#FFF8EA;line-height:1}
  .grp em{
    position:absolute;left:50%;bottom:15px;transform:translateX(-50%);white-space:nowrap;
    font-style:normal;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  .tick{
    position:absolute;top:74px;font-size:11px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .tick.r{right:0}
  .own{
    position:absolute;height:23px;border-radius:4px;background:var(--c);
    box-shadow:0 1px 2px rgba(0,0,0,.16);
  }
  .own em{
    position:absolute;left:9px;top:0;line-height:23px;font-style:normal;
    color:#FFF8EA;font-size:11px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .own.out em{left:calc(100% + 8px);color:var(--ink-2)}
  .life__lg{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:12px}
  .life__lg span{display:flex;align-items:center;gap:7px}
  .life__lg i{width:11px;height:11px;border-radius:50%;background:var(--ink-3);flex:none}
  .life__lg i.bar{width:17px;height:9px;border-radius:3px;background:var(--era-3);flex:none}

  /* ── moments ── */
  .mom{display:flex;flex-direction:column}
  .mo{display:flex;gap:12px;min-height:34px}
  .mo__y{flex:none;width:52px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:7px}
  .mo__s{flex:none;width:24px;position:relative}
  .mo__s::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--c);opacity:.3}
  .mo:first-child .mo__s::before{top:13px}
  .mo:last-child .mo__s::before{height:13px}
  .mo__s i{
    position:absolute;left:50%;top:13px;transform:translate(-50%,-50%);z-index:1;
    width:24px;height:24px;border-radius:50%;background:var(--surface-2);
    display:grid;place-items:center;color:var(--c);
  }
  .mo__b{flex:1;min-width:0;padding:5px 0 11px}
  .mo__b b{font-size:14px;font-weight:500;display:block}
  .mo__b span{font-size:12px;color:var(--ink-3)}
  .mo__b .souv{margin-top:7px;font-size:14.5px}
  .addm{font-size:12.5px;color:var(--focus);text-decoration:underline;text-underline-offset:3px;margin-left:80px}

  /* ── exemplaires et éditions ── */
  .cop{display:flex;flex-direction:column;gap:9px}
  .cp{display:flex;align-items:center;gap:12px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
  .cp .art{width:34px;aspect-ratio:3/4}
  .cp .art>span{font-size:6px}
  .cp div{flex:1;min-width:0}
  .cp b{display:block;font-size:13.5px;font-weight:500}
  .cp span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .cp .mk{margin-left:auto;color:var(--ink-3)}

  .eds{display:flex;flex-wrap:wrap;gap:6px}
  .ed{
    font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;
  }
  .ed.mine{border-color:color-mix(in srgb,var(--era-2) 58%,transparent);background:color-mix(in srgb,var(--era-2) 12%,transparent);color:var(--era-ink);font-weight:600}
  .ed i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}

  .rel__w{display:flex;flex-direction:column;gap:8px}
  .rw{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);width:100%;transition:border-color .12s,background .12s}
  .rw:hover{border-color:var(--line-strong);background:var(--surface)}
  .rw .art{width:32px;aspect-ratio:3/4}
  .rw .art>span{font-size:5.5px}
  .rw div{flex:1;min-width:0}
  .rw b{display:block;font-size:13.5px;font-weight:500}
  .rw span{font-size:12px;color:var(--ink-3)}
  .rw em{font-style:normal;font-size:11px;color:var(--era-ink);font-weight:600;flex:none}

  /* ── état vide ── */
  .empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .empty p{margin:0;font-size:14px;color:var(--ink-2);max-width:48ch}
  .empty .why{font-size:12.5px;color:var(--ink-3);padding:10px 13px;border-radius:var(--r-s);background:var(--surface-3);max-width:52ch}

  @media (max-width:520px){
    .shell{padding:14px 10px 32px}
    .me,.sec{padding:16px 14px}
    .hd{padding:13px 14px}
    .me__art{width:84px}
    .mo__y{width:44px}
    .addm{margin-left:0}
    .life__ax{margin:0 18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<div class="shell">
  <div class="bar">
    <div class="bar__id">Fiche jeu <span>· E05</span></div>
    <div class="seg" role="group" aria-label="Cas de démonstration">
      <button data-g="ff7" aria-pressed="true">Possédé 3 fois</button>
      <button data-g="sf2" aria-pressed="false">Jamais possédé</button>
      <button data-g="ct" aria-pressed="false">Jamais joué</button>
    </div>
  </div>
  <p class="note">
    Trois cas, pas un seul : la fiche doit tenir aussi bien sur une œuvre traversée pendant
    <b>vingt-huit ans</b> que sur un jeu <b>joué chez quelqu'un</b> ou jamais rencontré.
    La couche personnelle passe <b>avant</b> les faits — c'est une biographie, pas une encyclopédie.
  </p>

  <div class="app" id="app"></div>
</div>

<script>
const ERAS=[[1990,"--era-1"],[1995,"--era-2"],[2000,"--era-3"],[2006,"--era-4"],[2013,"--era-5"],[9999,"--era-6"]];
const eraVar=y=>ERAS.find(e=>y<=e[0])[1];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function hexToHsl(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s*100,l*100];}
const PAT=[
  d=>`repeating-linear-gradient(${45+d%20}deg, rgba(255,255,255,.5) 0 6%, transparent 6% 26%)`,
  d=>`radial-gradient(circle at center, rgba(255,255,255,.5) 6%, transparent 7%) 0 0/${18+d%10}% ${14+d%8}%`,
  d=>`repeating-linear-gradient(90deg, rgba(0,0,0,.26) 0 5%, transparent 5% ${22+d%10}%)`,
  d=>`repeating-linear-gradient(0deg, rgba(255,255,255,.38) 0 3%, transparent 3% 21%), repeating-linear-gradient(90deg, rgba(255,255,255,.38) 0 3%, transparent 3% 21%)`,
  d=>`repeating-conic-gradient(from ${d%90}deg at 50% 50%, rgba(255,255,255,.28) 0 11deg, transparent 11deg 29deg)`,
  d=>`repeating-radial-gradient(circle at 22% 14%, transparent 0 14%, rgba(0,0,0,.2) 14% 17%)`];
const hx={};
function eh(v){ if(!hx[v]){const c=getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  hx[v]=/^#[0-9a-f]{6}$/i.test(c)?c:"#B0842B";} return hx[v]; }
function art(t,y){const n=hash(t),[h,s,l]=hexToHsl(eh(eraVar(y)));
  const hu=(h+(n%21)-10+360)%360, lu=Math.max(24,Math.min(58,l+((n>>5)%13)-6));
  return `background-color:hsl(${hu.toFixed(0)} ${s.toFixed(0)}% ${lu.toFixed(0)}%);--art-pattern:${PAT[n%PAT.length](n)};`;}

/* ─────────────────────────────────────────────────────────────
   Trois cas, choisis pour couvrir la plage réelle de la fiche.
   FFVII démontre la chaîne Œuvre / Sortie / Édition : le remake
   est une œuvre LIÉE, pas la même — c'est la frontière que le
   modèle doit rendre lisible (SPECIFICATION §6.3).
   ───────────────────────────────────────────────────────────── */
const GAMES={
  ff7:{
    title:"Final Fantasy VII", studio:"Squaresoft", year:1997, genre:"JRPG",
    plat:"PlayStation", region:"PAL",
    releases:[[1997,"PS1 · Japon"],[1997,"PS1 · PAL"],[1998,"PC"],[1998,"Platinum"],
              [2009,"PSN · PS3"],[2015,"PS4"],[2015,"iOS"],[2019,"Switch, Xbox One"]],
    me:{w:"rel", c:"done", aff:"fav", h:"own"},
    moments:[
      [1997,"p","Découvert","PlayStation, chez un cousin"],
      [1998,"d","Terminé","édition PAL Platinum","Fini un dimanche de novembre, chez mon frère. On avait commencé le vendredi soir."],
      [2001,"o","Vendu","parti avec la console"],
      [2012,"o","Racheté","version numérique, sur PC"]
    ],
    copies:[["PlayStation PAL · Platinum",1997,2001,"cédée avec la console"],
            ["PC · numérique",2012,null,"toujours dans votre bibliothèque"]],
    linked:[["Final Fantasy VII Remake",2020,"remake — œuvre liée, pas la même",true],
            ["Crisis Core: Final Fantasy VII",2008,"préquelle",false],
            ["Série Final Fantasy",null,"16 œuvres principales",false]],
    aka:["ファイナルファンタジーVII"],
    fact:"Septième épisode de la série, et le premier sur PlayStation — c'est celui qui a fait basculer Final Fantasy hors de Nintendo.",
    ext:[["Wikipédia","fr:Final_Fantasy_VII"],["MobyGames","game/7147"],["HowLongToBeat","game/3300"]],
    others:{n:312,fav:89,souv:41,
      quotes:[["Le premier jeu qui m'a fait pleurer. J'avais quatorze ans.","Marc, préféré sur PlayStation"],
              ["On se passait les disques dans la cour du collège.","Sophie, 1998"]]}
  },
  sf2:{
    title:"Street Fighter II Turbo", studio:"Capcom", year:1993, genre:"Combat",
    plat:"Super Nintendo", region:"PAL",
    releases:[[1992,"Arcade"],[1993,"SNES · PAL"],[1993,"Mega Drive"],[1996,"PS1"],[1997,"Saturn"]],

const LBL={
  w:{rel:"à sa sortie",soon:"peu après",late:"bien plus tard"},
  c:{done:["fini","done"],prog:["toujours en cours","prog"],quit:["abandonné","quit"]},
  aff:{meh:["sans plus","meh"],love:["j'ai adoré","love"],fav:["mon préféré","fav"]},
  h:{own:["je l'avais","box"],at:["chez quelqu'un","home"],borrow:["emprunté","swap"]}
};
const MO={p:"played",d:"done",o:"box"};

/* Un seul jeu d'icônes, trois familles lisibles sans légende :
   ce qu'on a fait du jeu, où l'objet se trouvait, ce qu'il a laissé. */
const ICO={
  played:'<rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h3M8.5 10.5v3"/><circle cx="16" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.4" cy="13.4" r="1.1" fill="currentColor" stroke="none"/>',
  done:'<path d="M5 22V3"/><path d="M5 4h13l-2.6 4.5L18 13H5"/>',
  prog:'<path d="M7 4.5v15l12-7.5z"/>',
  quit:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  never:'<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>',
  box:'<path d="M21 8.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5"/><rect x="2" y="3" width="20" height="5.5" rx="1"/><path d="M10 12.5h4"/>',
  home:'<path d="M3 10.6 12 3.2l9 7.4"/><path d="M5.5 9.4V20.8h13V9.4"/>',
  swap:'<path d="m16.5 3 4.5 4.5-4.5 4.5"/><path d="M21 7.5H8"/><path d="M7.5 21 3 16.5 7.5 12"/><path d="M3 16.5h13"/>',
  meh:'<path d="M5 12h14"/>',
  love:'<path d="M20.6 5.9a5.4 5.4 0 0 0-7.7 0L12 6.9l-1-1a5.4 5.4 0 0 0-7.7 7.7l8.7 8.6 8.6-8.6a5.4 5.4 0 0 0 0-7.7z"/>',
  fav:'<path d="M20.6 5.9a5.4 5.4 0 0 0-7.7 0L12 6.9l-1-1a5.4 5.4 0 0 0-7.7 7.7l8.7 8.6 8.6-8.6a5.4 5.4 0 0 0 0-7.7z" fill="currentColor"/>'
};
const ic=(n,sz)=>n?`<svg class="mk" width="${sz||15}" height="${sz||15}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`:"";

function sentence(g){
  const m=g.me, bits=[];
  if(m.n) return "Vous ne l'avez jamais joué.";
  if(m.w) bits.push(`vous y avez joué <b>${LBL.w[m.w]}</b>`);
  if(m.c) bits.push(`vous l'avez <b>${LBL.c[m.c][0]}</b>`);
  if(m.h==="own") bits.push("vous l'aviez");
  if(m.h==="at") bits.push("<b>chez quelqu'un</b>, jamais chez vous");
  if(m.h==="borrow") bits.push("vous l'aviez emprunté");
  if(!bits.length) return "Vous y avez joué.";
  const s=bits.join(", ");
  return s.charAt(0).toUpperCase()+s.slice(1)+".";
}

function lifeAxis(g){
  const ys=[...g.releases.map(r=>r[0]), ...g.copies.map(c=>c[1]), ...g.copies.map(c=>c[2]||2026)];
  const min=Math.min(...ys)-1, max=Math.max(...ys,2026)+1, span=max-min;
  const pc=y=>((y-min)/span*100);

  /* Groupement : deux sorties dont les étiquettes se chevaucheraient
     deviennent un seul point. Le seuil est exprimé en part de l'axe,
     donc il s'adapte à la durée couverte. */
  const gap=Math.max(2,Math.round(span*0.07));
  const groups=[];
  [...g.releases].sort((a,b)=>a[0]-b[0]).forEach(([y,l])=>{
    const last=groups[groups.length-1];
    if(last && y-last.from<=gap){ last.to=y; last.items.push(l); }
    else groups.push({from:y,to:y,items:[l]});
  });

  const dots=groups.map(gr=>{
    const mid=(gr.from+gr.to)/2, n=gr.items.length;
    const label=gr.from===gr.to?`${gr.from}`:`${gr.from}–${String(gr.to).slice(2)}`;
    const title=gr.items.join(" · ");
    return `<span class="grp ${n>1?"multi":""}" style="left:${pc(mid).toFixed(2)}%;--c:var(${eraVar(gr.from)})" title="${title}">
      <i>${n>1?`<b>${n}</b>`:""}</i><em>${label}</em></span>`;
  }).join("");

  const bands=g.copies.map(([l,a,b],i)=>{
    const end=b||2026, w=Math.max(3,(end-a)/span*100), narrow=w<22;
    return `<span class="own ${narrow?"out":""}" style="left:${pc(a).toFixed(2)}%;width:${w.toFixed(2)}%;top:${94+i*30}px;--c:var(${eraVar(a)})">
      <em>${a}–${b||"aujourd'hui"}</em></span>`;
  }).join("");

  const h=94+Math.max(1,g.copies.length)*30;
  return `<div class="life">
    <div class="life__ax" style="height:${h}px">
      <span class="life__rule"></span>
      <span class="tick">${min+1}</span><span class="tick r">${max-1}</span>
      ${dots}${bands}
    </div>
    <div class="life__lg">
      <span><i></i> sorties et rééditions — le chiffre indique combien la même année</span>
      ${g.copies.length?'<span><i class="bar"></i> les périodes où vous l\'aviez</span>':""}
    </div>
  </div>`;
}

function render(k){
  const g=GAMES[k], c=`var(${eraVar(g.year)})`;
  const has=!!g.me;

  const meBlock = has ? `
    <div class="me" style="--c:${c}">
      <div class="me__top">
        <span class="art me__art" style="${art(g.title,g.year)}"><span>${g.title.split(":")[0]}</span></span>
        <div class="me__sum">
          <div class="me__marks">
            ${g.me.c?ic(LBL.c[g.me.c][1],19):ic("played",19)}
            ${g.me.h?ic(LBL.h[g.me.h][1],19):""}
            ${g.me.aff?ic(LBL.aff[g.me.aff][1],19):""}
          </div>
          <p class="me__line">${sentence(g)}</p>
          <span class="me__sub">${g.copies.length?`${g.copies.length} exemplaire${g.copies.length>1?"s":""} au fil du temps`:"Jamais possédé"}</span>
        </div>
      </div>
      ${g.moments.filter(m=>m[4]).map(m=>`<p class="souv">${m[4]}</p>`)[0]||""}
      <div class="q">
        <span class="q__l">Vous l'avez fini ?</span>
        <div class="q__r">${Object.entries(LBL.c).map(([v,[l,m]])=>
          `<button data-f="c" data-v="${v}" aria-pressed="${g.me.c===v}">${ic(m)} ${l}</button>`).join("")}</div>
      </div>
      <div class="q">
        <span class="q__l">Ça vous a marqué ?</span>
        <div class="q__r">${Object.entries(LBL.aff).map(([v,[l,m]])=>
          `<button data-f="aff" data-v="${v}" aria-pressed="${g.me.aff===v}">${ic(m)} ${l}</button>`).join("")}</div>
      </div>
      <div class="q">
        <span class="q__l">Comment y avez-vous joué ?</span>
        <div class="q__r">${Object.entries(LBL.h).map(([v,[l,m]])=>
          `<button data-f="h" data-v="${v}" aria-pressed="${g.me.h===v}">${ic(m)} ${l}</button>`).join("")}</div>
      </div>
    </div>` : `
    <div class="me" style="--c:${c}">
      <div class="me__top">
        <span class="art me__art" style="${art(g.title,g.year)}"><span>${g.title.split(":")[0]}</span></span>
        <div class="me__sum">
          <p class="me__line">Vous n'avez rien déclaré sur ce jeu.</p>
          <span class="me__sub">Ce n'est pas une absence de données : c'est une question qu'on ne vous a pas encore posée.</span>
        </div>
      </div>
      <div class="empty">
        <div class="q">
          <span class="q__l">Vous y avez joué ?</span>
          <div class="q__r">
            <button data-f="c" data-v="done">${ic("played")} oui</button>
            <button data-f="never" data-v="1">${ic("never")} jamais</button>
          </div>
        </div>
        <p class="why">${g.region==="NTSC"
          ? `<b>Vous n'aviez guère pu le croiser.</b> Aucune sortie européenne sur Super Nintendo — voir la note d'identification ci-contre.`
          : `Aucune sortie de ce titre dans votre région à l'époque.`}</p>
      </div>
    </div>`;

  const momBlock = g.moments.length ? `
    <div class="sec">
      <div class="sec__h"><h2>Votre histoire avec ce jeu</h2><span>${g.moments.length} moment${g.moments.length>1?"s":""}</span></div>
      <div class="mom">${g.moments.map(([y,t,ttl,sub,souv])=>`
        <div class="mo" style="--c:${c}">
          <div class="mo__y">${y}</div>
          <div class="mo__s"><i>${ic(MO[t],14)}</i></div>
          <div class="mo__b"><b>${ttl}</b><span>${sub}</span>
            ${souv?`<p class="souv">${souv}</p>`:""}</div>
        </div>`).join("")}</div>
      <button class="addm">+ ajouter un moment</button>
    </div>` : "";

  const copBlock = g.copies.length ? `
    <div class="sec">
      <div class="sec__h"><h2>Vos exemplaires</h2><span>${g.copies.length}</span></div>
      <p class="intro">Le même titre, possédé plusieurs fois, sur plusieurs supports, à plusieurs époques. C'est la granularité que le modèle existe pour porter.</p>
      <div class="cop">${g.copies.map(([l,a,b,n])=>`
        <div class="cp" style="--c:var(${eraVar(a)})">
          <span class="art" style="${art(l,a)}"><span>${l.split("·")[0]}</span></span>
          <div><b>${l}</b><span>${a}–${b||"aujourd'hui"} · ${n}</span></div>
          ${ic("box",17)}
        </div>`).join("")}</div>
    </div>` : "";

  document.getElementById("app").innerHTML=`
    <div class="hd">
      <button class="ic" aria-label="Retour">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="hd__t">
        <h1>${g.title}</h1>
        <p>${g.studio} · ${g.year} · ${g.plat} <span class="chip">${g.region}</span> · ${g.genre}</p>
      </div>
    </div>
    <div class="cols">
      <div class="colL">${meBlock}</div>
      <div class="colR">
        <div class="ident">
          ${g.aka.length?`<div class="aka"><b>aussi connu sous</b>${g.aka.map(a=>`<span>${a}</span>`).join("")}</div>`:""}
          <p class="fact">${g.fact}</p>
        </div>
        <div class="sec">
          <div class="sec__h"><h2>L'œuvre et vous</h2><span>${g.releases.length} sorties connues</span></div>
          <p class="intro">Une œuvre vit bien plus longtemps qu'une console. L'axe montre ses rééditions${g.copies.length?", et les périodes où vous en aviez un exemplaire":""}.</p>
          ${lifeAxis(g)}
        </div>
        ${momBlock}
        ${copBlock}
        <div class="sec">
          <div class="sec__h"><h2>Éditions connues</h2><span>${g.releases.length}</span>
            <button class="more">tout voir</button></div>
          <div class="eds">${g.releases.map(([y,l])=>{
            const mine=g.copies.some(c=>l.includes("Platinum")&&c[0].includes("Platinum")||l==="PC"&&c[0].includes("PC"));
            return `<span class="ed ${mine?"mine":""}" style="--c:var(${eraVar(y)})"><i></i>${l} · ${y}${mine?" ·  le vôtre":""}</span>`;
          }).join("")}</div>
        </div>
        <div class="sec">
          <div class="sec__h"><h2>Œuvres liées</h2></div>
          <p class="intro">Un remake est une œuvre <b>liée</b>, pas la même. Les confondre casserait la chaîne des éditions et fausserait vos statistiques.</p>
          <div class="rel__w">${g.linked.map(([t,y,d,mine])=>`
            <button class="rw">
              ${y?`<span class="art" style="${art(t,y)}"><span>${t.split(":")[0]}</span></span>`:""}
              <div><b>${t}${y?` · ${y}`:""}</b><span>${d}</span></div>
              ${mine?'<em>dans votre histoire</em>':""}
            </button>`).join("")}</div>
        </div>

        <div class="sec">
          <div class="sec__h"><h2>En savoir plus</h2><span class="ph">Phase 3</span></div>
          <p class="intro">La plateforme n'écrit pas de synopsis : décrire n'est pas son métier, et recopier une base tierce est illicite (§19.1). Elle <b>renvoie</b>, en conservant l'identifiant de chaque source (§18.4) — jamais une URL devinée, qui finirait par casser.</p>
          <div class="ext">${g.ext.map(([n,id])=>`
            <div class="ext__r"><b>${n}</b><code>${id}</code>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
            </div>`).join("")}</div>
          <p class="intro" style="margin:12px 0 0">Position basse et aspect de référence, délibérément : un lien sortant est un lecteur qui part.</p>
        </div>

        <div class="sec">
          <div class="sec__h"><h2>Ce que d'autres en ont fait</h2><span class="ph">Phase 5</span></div>
          <p class="intro">La seule description que cette plateforme puisse <b>posséder</b> plutôt qu'emprunter. Aucune encyclopédie ne l'a, elle ne coûte aucune curation, et elle rend la fiche utile à quelqu'un qui ne connaît pas le jeu.</p>
          <div class="oth">
            <div><b>${g.others.n}</b><span>joueurs l'ont déclaré</span></div>
            <div><b>${g.others.fav}</b><span>en ont fait leur préféré</span></div>
            <div><b>${g.others.souv}</b><span>souvenirs publics</span></div>
          </div>
          <div class="pub">${g.others.quotes.map(([q,who])=>
            `<p>${q}<em>${who}</em></p>`).join("")}</div>
        </div>
      </div>
    </div>`;
}

document.querySelector(".seg").addEventListener("click",e=>{
  const b=e.target.closest("[data-g]"); if(!b) return;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render(b.dataset.g);
});
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  const k=document.querySelector('.seg [aria-pressed="true"]').dataset.g, g=GAMES[k];
  if(!g.me) g.me={};
  const f=b.dataset.f;
  if(f==="never"){ g.me={n:true}; render(k); return; }
  g.me.n=false;
  g.me[f]=g.me[f]===b.dataset.v?null:b.dataset.v;
  render(k);
});

const mq=matchMedia("(prefers-color-scheme: dark)");
if(mq.addEventListener) mq.addEventListener("change",()=>{Object.keys(hx).forEach(k=>delete hx[k]);
  render(document.querySelector('.seg [aria-pressed="true"]').dataset.g);});

render("ff7");
</script>
